approved_exceptions:
  - gate: parcel
    reason: Candidate assignment is public-data only, so the paid Santa Clara Assessor Secured Master File (AMF/MF901/MF901B) is out of scope and was not purchased. No current official assessed-parcel denominator is in hand. Public GIS layer ubcd-cewv has 504717 features. The Assessor public order form (2021) described the paid AMF as about 458000 records (about 10.2 percent below GIS if used as literature only). GIS is the seed backbone for this run only, not a claim of complete assessed-property coverage. GIS may extra-count air/condo polygons and omit or distort separately assessed units, right-of-way, or unofficial-record mismatches; coverage is GIS-feature coverage as of FY2026, not roll completeness. Provenance: keep source APN as text, dataset URL, retrieve timestamp, and native geometry; never invent coordinates or digits-only keys.
